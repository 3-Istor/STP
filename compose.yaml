services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: bom
      POSTGRES_DB: bomstudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom -d bomstudio"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
