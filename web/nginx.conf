# Front statique + proxy vers le back, comme le proxy de `vite.config.ts` en dev (voir ADR 0005).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Tree JSON is ~20 MB raw; text/event-stream is not listed, so SSE stays uncompressed.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # API et santé du back. Pas de bufferisation ni de délai court : les flux SSE
    # (ADR 0003) doivent passer événement par événement et rester ouverts.
    location ~ ^/(api/|healthz$) {
        proxy_pass http://back:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # A missing chunk (stale tab after a redeploy) or 3D model must 404, not get index.html.
    location /assets/ {
        try_files $uri =404;
    }
    location /models/ {
        try_files $uri =404;
    }

    # Application React (SPA) : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
