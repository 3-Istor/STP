# golangci-lint v2 — voir ADR 0001.
version: "2"
linters:
  default: standard
  enable:
    - gosec      # analyse de sécurité (injection SQL, chemins, crypto faible…)
    - errorlint  # erreurs comparées avec errors.Is / errors.As (AGENTS §4)
    - bodyclose
    - noctx
  exclusions:
    rules:
      - path: _test\.go
        linters: [noctx] # httptest.NewRequest est l'usage normal en test
