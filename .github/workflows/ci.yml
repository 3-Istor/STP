# Pipeline CI — voir docs/workflow.md §7 et ADR 0001.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule la CI précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    # Base réelle pour les migrations et les tests d'intégration (identifiants de test, cf. compose.yaml).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bom
          POSTGRES_PASSWORD: bom
          POSTGRES_DB: bomstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bom -d bomstudio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bom:bom@localhost:5432/bomstudio?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy à jour
        run: go mod tidy -diff
      - name: Code sqlc à jour
        run: |
          go tool sqlc generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: Migrations réversibles (up, reset, up)
        run: |
          go tool goose -dir migrations postgres "$DATABASE_URL" up
          go tool goose -dir migrations postgres "$DATABASE_URL" reset
          go tool goose -dir migrations postgres "$DATABASE_URL" up
      - run: go vet ./...
      - name: golangci-lint (dont gosec)
        run: go tool golangci-lint run ./...
      - name: Tests (race) + couverture, dont intégration Postgres
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Résumé de couverture
        run: |
          {
            echo "### Couverture Go (indicateur, non bloquant)"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Failles connues (dépendances de prod)
        run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go tool govulncheck ./...

  # Smoke test de la stack complète (voir ADR 0005) : tout démarre, /healthz répond via nginx et
  # depuis le conteneur de l'API de prix.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer la stack
        run: docker compose up -d --build --wait
      - name: Back via nginx
        run: curl -fsS localhost:8000/healthz
      - name: API de prix dans son conteneur
        run: docker compose exec -T priceapi wget -qO- localhost:8090/healthz
      - name: Migrations appliquées
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose ps -a && docker compose logs
      - name: Arrêt
        if: always()
        run: docker compose down -v
