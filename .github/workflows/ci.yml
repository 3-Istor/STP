# Pipeline CI — voir docs/workflow.md §7, ADR 0001 et ADR 0039 (harnais).
# Actions épinglées par SHA (une étiquette se déplace, un SHA non) ; Dependabot les met à jour.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule la CI précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    # Base réelle pour les migrations et les tests d'intégration (identifiants de test, cf. compose.yaml).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bom
          POSTGRES_PASSWORD: bom
          POSTGRES_DB: bomstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bom -d bomstudio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bom:bom@localhost:5432/bomstudio?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go mod tidy à jour
        run: go mod tidy -diff
      - name: Code sqlc à jour
        run: |
          go tool sqlc generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: Migrations réversibles (up, reset, up)
        run: |
          go tool goose -dir migrations postgres "$DATABASE_URL" up
          go tool goose -dir migrations postgres "$DATABASE_URL" reset
          go tool goose -dir migrations postgres "$DATABASE_URL" up
      - run: go vet ./...
      - name: golangci-lint (dont gosec)
        run: go tool golangci-lint run ./...
      - name: Tests (race) + couverture, dont intégration Postgres
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Résumé de couverture
        run: |
          {
            echo "### Couverture Go (indicateur, non bloquant)"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 14

  web:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Tests unitaires de logique pure (node --test, vue 3D, ADR 0035)
        run: npm run test:unit
      - run: npm run build
      - name: Navigateurs de test (ADR 0013)
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Parcours UI sur les trois moteurs, ordinateur et mobile
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failures
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Failles connues (dépendances de prod)
        run: npm audit --omit=dev --audit-level=high

  web-live:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bom
          POSTGRES_PASSWORD: bom
          POSTGRES_DB: bomstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bom -d bomstudio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bom:bom@localhost:5432/bomstudio?sslmode=disable
      NLPF68_BROWSER_MODE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Navigateurs de test
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Vraie source HTTP, ingestion, PostgreSQL, SSE et UI
        run: go test -race -count=1 -timeout=4m -run '^TestPricingLiveBrowsers$' ./internal/pricing/pricingstore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-live-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go tool govulncheck ./...

  # Smoke test de la stack complète (voir ADR 0005) : tout démarre, /healthz répond via nginx et
  # depuis le conteneur de l'API de prix.
  compose:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Démarrer la stack
        run: docker compose up -d --build --wait
      - name: Back via nginx
        run: curl -fsS localhost:8000/healthz
      - name: API de prix dans son conteneur
        run: docker compose exec -T priceapi wget -qO- localhost:8090/healthz
      - name: Migrations appliquées
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose ps -a && docker compose logs
      - name: Arrêt
        if: always()
        run: docker compose down -v

  # Niveau de risque du changement (ADR 0039) : dit à l'humain ce qu'il doit relire, et où.
  risk:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Niveau de risque et point de contrôle humain
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          go run ./cmd/risk -base "origin/$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"
          go run ./cmd/risk -base "origin/$BASE_REF" -json > risk.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: risk
          path: risk.json
          retention-days: 30

  # Chaîne d'approvisionnement (ADR 0039) : outils épinglés dans scripts/tools.env.
  supply-chain:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Outils épinglés
        run: ./scripts/install-tools.sh && echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Secrets dans les commits de la PR (gitleaks)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: gitleaks git --redact --no-banner --log-opts="$BASE_SHA..HEAD"
      - name: Secrets dans le dernier push (gitleaks)
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --no-banner --log-opts="-1"
      - name: Failles connues, Go et npm (osv-scanner)
        run: osv-scanner scan source --lockfile go.mod --lockfile web/package-lock.json
      - name: Workflows GitHub (actionlint)
        run: actionlint
      - name: SBOM CycloneDX (Go et web)
        run: |
          mkdir -p sbom
          cyclonedx-gomod mod -json -output sbom/go.cdx.json
          npm --prefix web sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom/web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

