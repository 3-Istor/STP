# Capteurs coûteux, chaque nuit (ADR 0039) : fuzzing des montants, mutation, secrets sur tout
# l'historique, tests d'intégration. Même script qu'en local : ./scripts/verify.sh nightly.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bom
          POSTGRES_PASSWORD: bom
          POSTGRES_DB: bomstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bom -d bomstudio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bom:bom@localhost:5432/bomstudio?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Outils épinglés (scripts/tools.env)
        run: ./scripts/install-tools.sh && echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Migrations
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up
      - name: Moulinette nightly
        run: ./scripts/verify.sh nightly
      - name: Résumé
        if: always()
        run: cat .verify/verify-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-nightly
          path: .verify/
          retention-days: 14
